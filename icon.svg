<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Demo Interattive — il telefono che il cliente tocca, e una frase che
       arriva da fuori: la bolla è intera, la coda esce dalla cornice, come nei
       fumetti quando chi parla resta fuori dalla vignetta.
       Il filo di sfondo attorno alla bolla la stacca dal telefono. -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <clipPath id="cornice"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#cornice)">
    <rect width="1024" height="1024" fill="url(#sfondo)"/>

    <rect x="238" y="250" width="376" height="566" rx="94" fill="#ffffff"/>
    <circle cx="426" cy="533" r="46" fill="url(#sfondo)"/>
    <circle cx="426" cy="533" r="101" fill="none" stroke="url(#sfondo)" stroke-width="25" opacity=".55"/>

    <path d="M556 168h270a60 60 0 0 1 60 60v24l294 44-294 100v24a60 60 0 0 1-60 60H556a60 60 0 0 1-60-60V228a60 60 0 0 1 60-60z"
      fill="#ffffff" stroke="url(#sfondo)" stroke-width="30"/>
  </g>
</svg>
